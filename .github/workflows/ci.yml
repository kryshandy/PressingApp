name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Accents corrompus (« Ã© », « â€™ ») et scripts .ps1 sans BOM UTF-8 : échec immédiat, avec fichier:ligne.
      - name: Contrôle d'encodage
        shell: powershell
        run: ./scripts/check-encoding.ps1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restauration
        run: dotnet restore PressingApp.sln

      - name: Compilation (avertissements = erreurs)
        run: dotnet build PressingApp.sln --no-restore -c Release -warnaserror

      - name: Tests
        run: dotnet test PressingApp.sln --no-build -c Release --verbosity normal

      # Autotest Desktop sans interaction : API jetable (base temporaire, port 5290) + Pressing.Desktop.exe --selftest.
      - name: Autotest Desktop
        shell: powershell
        run: ./scripts/ci-selftest.ps1 -Port 5290

      - name: Journal de l'autotest Desktop (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pressing-selftest-log
          path: artifacts/selftest/
          if-no-files-found: ignore
